name: HIP compile expanded L2 prefetch on main

on:
  push:
    branches:
      - ci/hip-prefetch-main
  workflow_dispatch:

jobs:
  hip-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: rocm/dev-ubuntu-24.04:10.1.0-full
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates cmake git ninja-build
      - uses: actions/checkout@v4
        with:
          ref: 30376a236a988d5565cbe4199fea7126555c788c
      - name: Verify submitted revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 30376a236a988d5565cbe4199fea7126555c788c
          git show --stat HEAD
          sha256sum src/kernels/cuda/native_mmvq.cu src/kernels/mmvq_il_parity.cpp
          test "$(sha256sum src/kernels/cuda/native_mmvq.cu | cut -d ' ' -f 1)" = 5caca488ba7ba44931cfe25dba13ca76bd8b9204d2365f675b724e3d6409f0b3
          hipcc --version
          cmake --version
          ninja --version
      - name: Configure HIP
        run: |
          cmake -S . -B build-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_ENABLE_HIP=ON \
            -DSTRATA_ENABLE_CUDA=OFF \
            -DSTRATA_BUILD_TESTS=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx1100
      - name: Build HIP engine
        run: cmake --build build-hip --target strata -j2
