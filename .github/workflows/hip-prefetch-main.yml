name: HIP compile Q6 L2 prefetch on main

on:
  push:
    branches:
      - ci/hip-prefetch-main
  workflow_dispatch:

jobs:
  hip-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: rocm/dev-ubuntu-24.04:10.1.0-full
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates cmake git ninja-build
      - uses: actions/checkout@v4
        with:
          ref: 568740210411ed21f813bb0156a381120daf08b0
      - name: Verify submitted revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 568740210411ed21f813bb0156a381120daf08b0
          git show --stat HEAD
          sha256sum src/kernels/cuda/native_mmvq.cu src/kernels/mmvq_il_parity.cpp
          hipcc --version
          cmake --version
          ninja --version
      - name: Configure HIP
        run: |
          cmake -S . -B build-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_ENABLE_HIP=ON \
            -DSTRATA_ENABLE_CUDA=OFF \
            -DSTRATA_BUILD_TESTS=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx1100
      - name: Build HIP engine and parity
        run: cmake --build build-hip --target strata mmvq_il_parity -j2
