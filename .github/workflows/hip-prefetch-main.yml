name: HIP compile upstream expert layouts

on:
  push:
    branches:
      - ci/hip-prefetch-main
  workflow_dispatch:

jobs:
  hip-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: rocm/dev-ubuntu-24.04:10.1.0-full
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates cmake git ninja-build
      - uses: actions/checkout@v4
        with:
          ref: c62d5e3a15b40ea51c96aae9e8d36928965f53ab
      - name: Verify submitted revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = c62d5e3a15b40ea51c96aae9e8d36928965f53ab
          git show --stat HEAD
          sha256sum src/kernels/cuda/iq_kernels.cu src/kernels/native_expert_parity.cpp
          test "$(sha256sum src/kernels/cuda/iq_kernels.cu | cut -d ' ' -f 1)" = 719f2eee24f93733778239bf7727db7a0e01b51d2841f05fb86120a7396ac8c5
          hipcc --version
          cmake --version
          ninja --version
      - name: Configure HIP
        run: |
          cmake -S . -B build-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRATA_ENABLE_HIP=ON \
            -DSTRATA_ENABLE_CUDA=OFF \
            -DSTRATA_BUILD_TESTS=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx1100
      - name: Build HIP engine
        run: cmake --build build-hip --target strata -j2
